name: Pelican random question evidence
on:
  pull_request:
    branches: [production]
    paths:
      - 'backend/internal/service/pelican*'
      - 'frontend/src/components/admin/account/Pelican*'
      - 'frontend/src/components/admin/account/IQTestModal.vue'
      - '.github/scripts/pelican-question-browser.mjs'
      - '.github/workflows/pelican-random-questions.yml'
permissions:
  contents: read
env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: bash .github/scripts/ci-ubuntu-mirrors.sh
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Targeted component, history, and round assertions
        run: pnpm --dir frontend exec vitest run src/utils/__tests__/pelicanQuestionRound.spec.ts src/components/admin/account/__tests__/IQTestModal.spec.ts src/components/admin/account/__tests__/PelicanPromptMode.spec.ts src/components/admin/account/__tests__/PelicanTestFields.spec.ts src/components/admin/account/__tests__/ScheduledTestsPanel.pelican.spec.ts src/components/admin/account/__tests__/PelicanRecordsDashboard.spec.ts src/views/admin/__tests__/PelicanTestsView.spec.ts
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pelican-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/pelican-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render actual controls and snapshot with fixture data
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/pelican-browser/node_modules/playwright
          PELICAN_SCREENSHOT_DIR: ${{ github.workspace }}/evidence
        run: node .github/scripts/pelican-question-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pelican-random-question-ui-${{ github.run_id }}
          path: evidence/

  pelican-round-evidence:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/issue795-round-evidence-followup-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact candidate head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: GREEN candidate regressions with fake upstream and real PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pelican-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pelican-evidence/candidate.txt"
          git diff --exit-code
          cd backend
          go test -race -tags=unit ./internal/service -run '^Test(Pelican|Intelligence|LegacyCandy|ScheduledPlanContains)' -count=1 -v -timeout=10m 2>&1 | tee "$RUNNER_TEMP/pelican-evidence/green-service.log"
          go test -tags=integration ./internal/repository -run '^TestPelican(GroupTestRepo_|SchedulePersistenceLeaseAndRetention|HistoryReturnsEveryRetainedOutputAcrossAccounts)' -count=1 -v -timeout=10m 2>&1 | tee "$RUNNER_TEMP/pelican-evidence/green-repository.log"
          grep -q -- '--- PASS: TestPelicanScheduledActualPromptMatchesSentPayload' "$RUNNER_TEMP/pelican-evidence/green-service.log"
          grep -q -- '--- PASS: TestPelicanGroupTestRepo_StaleNominalRoundCannotClaimLaterRound' "$RUNNER_TEMP/pelican-evidence/green-repository.log"
      - name: RED old production sources in isolated worktree retaining candidate regressions
        shell: bash
        run: |
          set -euo pipefail
          original=b5990096ae10a0b2481182f2ac45812effacda22
          git fetch --no-tags --depth=1 origin "$original"
          git worktree add --detach "$RUNNER_TEMP/pelican-red" "$EXPECTED_HEAD_SHA"
          cd "$RUNNER_TEMP/pelican-red"
          for target in backend/internal/service/pelican_scheduled.go backend/internal/repository/pelican_group_tests_repo.go; do
            git rev-parse "$original:$target" >> "$RUNNER_TEMP/pelican-evidence/original-blobs.txt"
            git show "$original:$target" > "$target"
          done
          git diff --stat > "$RUNNER_TEMP/pelican-evidence/red-diff.txt"
          cd backend
          set +e
          go test -tags=unit ./internal/service -run '^TestPelicanScheduledActualPromptMatchesSentPayload$' -count=1 -v -timeout=10m > "$RUNNER_TEMP/pelican-evidence/red-service.log" 2>&1
          service_status=$?
          go test -tags=integration ./internal/repository -run '^TestPelicanGroupTestRepo_StaleNominalRoundCannotClaimLaterRound$' -count=1 -v -timeout=10m > "$RUNNER_TEMP/pelican-evidence/red-repository.log" 2>&1
          repository_status=$?
          set -e
          cat "$RUNNER_TEMP/pelican-evidence/red-service.log"
          cat "$RUNNER_TEMP/pelican-evidence/red-repository.log"
          test "$service_status" -ne 0
          test "$repository_status" -ne 0
          ! grep -Eiq 'build failed|no tests to run|undefined:|--- SKIP:' "$RUNNER_TEMP/pelican-evidence/red-service.log" "$RUNNER_TEMP/pelican-evidence/red-repository.log"
          grep -q -- '--- FAIL: TestPelicanScheduledActualPromptMatchesSentPayload/custom' "$RUNNER_TEMP/pelican-evidence/red-service.log"
          grep -q 'saved actual prompt must match sent payload including delivery contract' "$RUNNER_TEMP/pelican-evidence/red-service.log"
          grep -q -- '--- FAIL: TestPelicanGroupTestRepo_StaleNominalRoundCannotClaimLaterRound' "$RUNNER_TEMP/pelican-evidence/red-repository.log"
          grep -q 'stale nominal round must not claim a later due round' "$RUNNER_TEMP/pelican-evidence/red-repository.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pelican-round-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pelican-evidence/
