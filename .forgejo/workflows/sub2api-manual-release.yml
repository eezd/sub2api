name: Manual release
run-name: Release ${{ inputs.source_branch }} (${{ inputs.request_id }})
on:
  workflow_dispatch:
    inputs:
      source_branch:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string
permissions:
  code: read
concurrency:
  group: sub2api-manual-release
  cancel-in-progress: false
jobs:
  release:
    if: forgejo.ref == 'refs/heads/main'
    runs-on: docker
    timeout-minutes: 115
    container:
      image: node:24-trixie
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      REQUEST_ID: ${{ inputs.request_id }}
      TRUSTED_SHA: ${{ forgejo.sha }}
      RELEASE_REF: ${{ forgejo.ref }}
      RELEASE_RUN_ID: ${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
      SUB2API_BUILD_DOCKER_IP: ${{ vars.SUB2API_BUILD_DOCKER_IP }}
      SUB2API_TEST_DOCKER_IP: ${{ vars.SUB2API_TEST_DOCKER_IP }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install release control tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl python3 docker-cli docker-buildx skopeo
      - name: Publish fixed source to Forgejo
        env:
          FORGEJO_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: python3 scripts/manual-release.py
